name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  SPACE_SCUFFLE_VIRTUAL_GPU: "1"
  # The runner has no GPU. Forcing lavapipe keeps CI from depending on the harness's `auto`
  # choice: a future runner with a GPU then stays on lavapipe instead of changing driver silently.
  SPACE_SCUFFLE_GPU_TEST_DRIVER: lavapipe

jobs:
  check-and-test:
    name: Format, Clippy & Workspace Tests (Headless + Virtual GPU)
    runs-on: ubuntu-latest
    # `cargo gate full` runs each test executable with its thread cap from crates/gate/suites.ron,
    # which keeps it inside the runner's 16 GB (docs/plans/2026-11-04-tiered-test-gates.md,
    # Amendment 5). At libtest's default of one thread per CPU the job would take about 67 min
    # (2026-11-09); the caps add about 30 min and the release and wasm32 replays about 4, so a green
    # run takes about 100 min. 150 leaves room without hiding a real hang: each GPU run has its own
    # 300 s limit on lavapipe in crates/client/tests/support/gpu_run.rs.
    timeout-minutes: 150

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # GitHub serves this job on two runner classes with the same image: Azure, 145 GiB root, and AWS
      # us-west-2, 72 GiB root (/dev/mapper/cow-root). Both use about 66 GiB before our build, which leaves
      # the AWS class about 6 GiB, and the test build writes about 8 GiB
      # (docs/plans/2026-11-04-ci-disk-guard-tripped.md). Delete preinstalled software this job never uses.
      # It runs on every runner, so every run measures what each path frees. A missing path is skipped.
      - name: Free preinstalled runner software
        run: |
          avail_mib() { echo $(( $(df --output=avail -k / | tail -1) / 1024 )); }
          echo "Runner class: $(cat /sys/class/dmi/id/sys_vendor 2>/dev/null || echo unknown)," \
            "image ${ImageOS:-unknown} ${ImageVersion:-unknown}," \
            "root $(df --output=source,size -h / | tail -1 | tr -s ' ')"
          df -h /
          start=$(avail_mib)
          for path in \
              /usr/local/lib/android \
              /usr/share/dotnet \
              /usr/local/.ghcup \
              /opt/ghc \
              /opt/hostedtoolcache/CodeQL \
              /usr/share/swift \
              /usr/local/julia* \
              /usr/share/miniconda \
              /usr/local/share/powershell \
              /usr/local/share/chromium \
              /opt/microsoft \
              /opt/google; do
            if [ ! -e "$path" ]; then
              echo "absent   $path"
              continue
            fi
            before=$(avail_mib)
            sudo rm -rf "$path"
            echo "freed $(( $(avail_mib) - before )) MiB  $path"
          done
          echo "Freed in total: $(( ($(avail_mib) - start) / 1024 )) GiB"
          df -h /

      # valgrind: crates/client/tests/sync_allocation_count_tests.rs counts the live battle sync's
      # steady-state heap allocations from outside the process with it (charter §3.3, Q0011). The
      # test fails, never skips, without it. It runs eight children of about 2 minutes each under
      # valgrind, at most one per core.
      - name: Install Linux system & virtual Vulkan GPU dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libasound2-dev \
            libudev-dev \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-0 \
            mesa-vulkan-drivers \
            vulkan-validationlayers \
            vulkan-tools \
            xvfb \
            valgrind \
            ffmpeg

      # `cargo gate full` also replays the golden fixture on wasm32-wasip1 under wasmtime and checks
      # the simulation crates for wasm32-unknown-unknown (the `commands` of crates/gate/suites.ron).
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
          targets: wasm32-wasip1, wasm32-unknown-unknown

      - name: Install wasmtime
        uses: bytecodealliance/actions/wasmtime/setup@v1

      - name: Rust Cargo Cache
        uses: Swatinem/rust-cache@v2

      # The memory the test run must fit in; GitHub documents 16 GB for this runner class. Runs from
      # 2026-11-06 to 2026-11-09 lost the runner during gpu_validation_tests with "The runner has
      # received a shutdown signal", the mark of a runner out of memory (Amendment 5).
      - name: Runner memory and CPUs
        run: |
          free -g
          echo "CPUs: $(nproc)"
          echo "cgroup memory.max: $(cat /sys/fs/cgroup/memory.max 2>/dev/null || echo unknown)"

      # The test build needs about 9.1 GiB of target/ when cold (docs/plans/2026-11-03-ci-disk-budget.md).
      # Report the disk before any build, so a red run shows how much the runner had to begin with.
      - name: Disk report after cache restore
        run: |
          df -h / "$GITHUB_WORKSPACE"
          du -sh target 2>/dev/null || echo "target/ not restored"

      - name: Check formatting (cargo fmt)
        run: cargo fmt --all -- --check

      - name: Lint workspace (cargo clippy)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Disk budget before the test build
        run: |
          df -h "$GITHUB_WORKSPACE"
          du -sh target
          need_gib=12
          avail_gib=$(( $(df --output=avail -k "$GITHUB_WORKSPACE" | tail -1) / 1024 / 1024 ))
          if [ "$avail_gib" -lt "$need_gib" ]; then
            echo "::error title=Disk budget::${avail_gib} GiB free under $GITHUB_WORKSPACE; the test build needs ${need_gib} GiB; runner $(cat /sys/class/dmi/id/sys_vendor 2>/dev/null) (docs/plans/2026-11-04-ci-disk-guard-tripped.md)"
            exit 1
          fi
          echo "Disk budget: ${avail_gib} GiB free, ${need_gib} GiB required"

      # The complete suite: every test executable and doc test of the workspace, each executable with
      # its thread cap from crates/gate/suites.ron, and the golden replays (charter §4.3). A plain
      # `cargo test --workspace` runs every executable at one thread per CPU, and then
      # gpu_validation_tests alone runs four lavapipe clients at once (Amendment 5). The gate writes
      # each target's log under ~/scratch/logs/gate/ and prints the result table. A background
      # sampler prints the memory every 30 s into this step's log, not the gate's, so a runner that
      # dies still shows how close it came. `shell: bash` runs the step with pipefail, so a red gate
      # fails it.
      - name: Run the complete suite with the catalog's thread caps (cargo gate full)
        shell: bash
        run: |
          # The sleep holds no descriptor of the step's output, so killing the sampler at exit
          # leaves nothing that keeps the step's log open.
          sample_memory() {
            while sleep 30 </dev/null >/dev/null 2>&1; do
              echo "memory $(date -u +%H:%M:%S):" \
                "$(free -m | awk '/^Mem:/ { printf "%d MiB available of %d MiB", $7, $2 }');" \
                "largest process $(ps -eo rss=,comm= --sort=-rss | awk 'NR == 1 { printf "%s %d MiB", $2, $1 / 1024 }')"
            done
          }
          sample_memory &
          sampler=$!
          trap 'kill "$sampler"' EXIT
          cargo gate full 2>&1 | tee "$RUNNER_TEMP/cargo-gate.log"

      # A report only: the gate's result table, each target's wall and CPU time, in the job summary
      # (plan §9.3).
      - name: Test timing summary
        if: always()
        continue-on-error: true
        run: |
          if [ -f "$RUNNER_TEMP/cargo-gate.log" ]; then
            {
              echo '```'
              sed -n '/^cargo gate full: results/,$p' "$RUNNER_TEMP/cargo-gate.log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the gate's logs of a red run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gate-logs
          path: ~/scratch/logs/gate/
          if-no-files-found: ignore
          retention-days: 14

      - name: Test binaries carry compressed debug info
        run: |
          bin=$(ls -t target/debug/deps/skirmish_match_tests-* | grep -v '\.d$' | head -1)
          readelf -SW "$bin" | sed 's/^ *\[ *[0-9]*\]//' \
            | awk '$1 == ".debug_info" { found = 1; ok = ($7 ~ /C/) } END { exit !(found && ok) }' \
            || { echo "::error title=Disk budget::$bin has uncompressed .debug_info; is RUSTFLAGS overriding .cargo/config.toml?"; exit 1; }
          ls -l "$bin"

      - name: Disk report after the test build
        if: always()
        run: |
          df -h "$GITHUB_WORKSPACE"
          du -sh target target/debug/deps 2>/dev/null || true
          find target/debug/deps -maxdepth 1 -type f -size +100M -printf '%s %f\n' 2>/dev/null \
            | sort -rn | head -5 | awk '{ printf "%6.0f MiB  %s\n", $1 / 1048576, $2 }'

  # The charter requires bit-for-bit identical simulation on every target. These jobs make
  # that claim executable: each target replays the same golden fixture, in debug and release,
  # so a platform or build-profile divergence fails with the first differing checkpoint.
  determinism-native:
    name: Determinism (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
          - name: Windows x86_64
            os: windows-latest
          - name: macOS ARM64
            os: macos-14

    steps:
      # Embedded data files must be byte-identical across hosts; never translate line endings.
      - name: Disable line-ending conversion
        run: git config --global core.autocrlf false

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.0

      - name: Rust Cargo Cache
        uses: Swatinem/rust-cache@v2

      - name: Test simulation crates (debug profile)
        run: cargo test -p sim_types -p sim_map -p sim_core --locked

      - name: Replay golden fixture (release profile)
        run: cargo test -p sim_core --test golden_replay_tests --locked --release

  determinism-wasm:
    name: Determinism (wasm32)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain with WebAssembly targets
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: wasm32-wasip1, wasm32-unknown-unknown

      - name: Install wasmtime
        uses: bytecodealliance/actions/wasmtime/setup@v1

      - name: Rust Cargo Cache
        uses: Swatinem/rust-cache@v2

      - name: Check simulation crates (wasm32-unknown-unknown)
        run: cargo check -p sim_types -p sim_map -p sim_core --target wasm32-unknown-unknown --locked

      - name: Replay golden fixture under wasmtime (wasm32-wasip1)
        run: cargo test -p sim_core --test golden_replay_tests --target wasm32-wasip1 --locked --release
        env:
          CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime

  # Charter §3.1: every benchmark scenario runs at least in real time. The floor is the
  # simulation's tick rate (sim_types::TICKS_PER_SECOND = 25); the table goes to the job summary
  # so each run publishes its figures. The benchmark needs only the simulation crates, so this
  # job installs no system packages and builds no client.
  throughput:
    name: Throughput floor (release)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.0

      - name: Rust Cargo Cache
        uses: Swatinem/rust-cache@v2

      - name: Benchmark the tick against the real-time floor
        run: |
          set -o pipefail
          cargo bench -p sim_core --bench throughput --locked -- --floor 25 | tee -a "$GITHUB_STEP_SUMMARY"
