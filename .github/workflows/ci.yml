name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  SPACE_SCUFFLE_VIRTUAL_GPU: "1"

jobs:
  check-and-test:
    name: Format, Clippy & Workspace Tests (Headless + Virtual GPU)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system & virtual Vulkan GPU dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libasound2-dev \
            libudev-dev \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libwayland-dev \
            libxkbcommon-dev \
            mesa-vulkan-drivers \
            vulkan-tools \
            xvfb \
            ffmpeg

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cargo Cache
        uses: Swatinem/rust-cache@v2

      - name: Check formatting (cargo fmt)
        run: cargo fmt --all -- --check

      - name: Lint workspace (cargo clippy)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run all workspace unit & integration tests (including xvfb + llvmpipe GPU tests)
        run: cargo test --workspace
