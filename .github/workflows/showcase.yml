# Renders the showcase video of the latest green `main` with the real engine on software Vulkan
# (plan docs/plans/2026-11-05-ci-showcase-video.md, D-11 to D-13; evidence
# docs/evidence/2026-11-05-showcase-video.md). It never gates CI or a merge: it runs only after CI
# succeeded, and its result is the video, not a verdict on the code.
name: Showcase video

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: Render even if nothing the video shows changed since the published revision
        type: boolean
        default: false

permissions:
  contents: read

# One render at a time. A render is never cancelled: CI finishes about hourly and a render takes
# most of an hour, so cancelling could starve. GitHub keeps only the newest pending run, so a burst
# of pushes renders the latest one.
concurrency:
  group: showcase
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # The published site; README.md names the same URL (charter check C24 compares them).
  SHOWCASE_SITE: https://close2.github.io/space-scuffle
  SPACE_SCUFFLE_VIRTUAL_GPU: "1"

jobs:
  render:
    name: Render the showcase (lavapipe)
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # Budget (plan D-13): render step <= 40 min, job <= 60 min; 90 leaves room for a cold cache.
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      rendered: ${{ steps.render.outcome == 'success' }}

    steps:
      # A workflow_run event runs this file from the default branch; the commit to render is the
      # one CI passed, not whatever main points at now.
      - name: Checkout the commit CI passed
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      # Skip when nothing the video shows changed since the published revision (D-11). The site's
      # showcase.json names that revision; without a site, or when it cannot be fetched, render.
      - name: Decide whether to render
        id: decide
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
        run: |
          render=true
          if [ "$FORCE" = "true" ]; then
            echo "Forced by workflow_dispatch."
          elif published=$(curl -fsSL --max-time 30 "$SHOWCASE_SITE/showcase.json" | jq -er '.revision'); then
            echo "Published revision: $published"
            if git fetch --no-tags --depth=1 origin "$published" \
                && git diff --quiet "$published" HEAD -- \
                  assets crates Cargo.lock DESIGN.md docs/plans/README.md .github/workflows/showcase.yml; then
              render=false
              echo "Nothing the video shows changed since $published; skipping the render."
            fi
          else
            echo "No published showcase.json; rendering."
          fi
          echo "render=$render" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "revision_date=$(git show -s --format=%cs HEAD)" >> "$GITHUB_OUTPUT"
          if [ "$render" = "false" ]; then
            echo "Skipped: nothing the showcase shows changed since the published revision." >> "$GITHUB_STEP_SUMMARY"
          fi

      # The same list as ci.yml's check-and-test: the AWS runner class starts with about 6 GiB free.
      - name: Free preinstalled runner software
        if: steps.decide.outputs.render == 'true'
        run: |
          avail_mib() { echo $(( $(df --output=avail -k / | tail -1) / 1024 )); }
          echo "Runner class: $(cat /sys/class/dmi/id/sys_vendor 2>/dev/null || echo unknown)," \
            "image ${ImageOS:-unknown} ${ImageVersion:-unknown}," \
            "root $(df --output=source,size -h / | tail -1 | tr -s ' ')," \
            "$(nproc) CPUs"
          start=$(avail_mib)
          for path in \
              /usr/local/lib/android \
              /usr/share/dotnet \
              /usr/local/.ghcup \
              /opt/ghc \
              /opt/hostedtoolcache/CodeQL \
              /usr/share/swift \
              /usr/local/julia* \
              /usr/share/miniconda \
              /usr/local/share/powershell \
              /usr/local/share/chromium \
              /opt/microsoft \
              /opt/google; do
            if [ ! -e "$path" ]; then
              echo "absent   $path"
              continue
            fi
            before=$(avail_mib)
            sudo rm -rf "$path"
            echo "freed $(( $(avail_mib) - before )) MiB  $path"
          done
          echo "Freed in total: $(( ($(avail_mib) - start) / 1024 )) GiB"
          df -h /

      # lavapipe and vulkaninfo (the take reads the Mesa release from it for the anisotropy rule of
      # Q0009), xvfb for the window, ffmpeg for the mezzanine and the encodes, and the client's
      # build libraries.
      - name: Install software Vulkan, Xvfb, ffmpeg and build libraries
        if: steps.decide.outputs.render == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libasound2-dev \
            libudev-dev \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-0 \
            mesa-vulkan-drivers \
            vulkan-tools \
            xvfb \
            ffmpeg
          vulkaninfo --summary 2>/dev/null | grep -E 'deviceName|driverInfo' || true
          ffmpeg -version | head -1

      - name: Install Rust toolchain
        if: steps.decide.outputs.render == 'true'
        uses: dtolnay/rust-toolchain@1.99.0

      # Its own key, so the release cache never replaces the test jobs' caches. rust-cache saves
      # only when its key missed (a new Cargo.lock or toolchain), not on every run (plan D-13).
      - name: Rust Cargo Cache (release)
        if: steps.decide.outputs.render == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          key: showcase-release

      # Release build about 4 GiB, mezzanine at most 1.3 GiB, the site and a margin (plan D-12).
      - name: Disk budget before the build
        if: steps.decide.outputs.render == 'true'
        run: |
          need_gib=10
          avail_gib=$(( $(df --output=avail -k "$GITHUB_WORKSPACE" | tail -1) / 1024 / 1024 ))
          if [ "$avail_gib" -lt "$need_gib" ]; then
            echo "::error title=Disk budget::${avail_gib} GiB free under $GITHUB_WORKSPACE; the showcase needs ${need_gib} GiB; runner $(cat /sys/class/dmi/id/sys_vendor 2>/dev/null)"
            exit 1
          fi
          echo "Disk budget: ${avail_gib} GiB free, ${need_gib} GiB required"

      - name: Build the showcase tool (release)
        if: steps.decide.outputs.render == 'true'
        run: cargo build --release --locked -p client_diagnostics --bin showcase

      # One take per child on lavapipe under xvfb-run, then the encodes (`showcase render`, plan
      # D-16): the same command a developer runs, with `--driver radv` on a GPU.
      - name: Render the showcase
        id: render
        if: steps.decide.outputs.render == 'true'
        env:
          SPACE_SCUFFLE_ASSETS: ${{ github.workspace }}/assets
          REVISION: ${{ steps.decide.outputs.revision }}
          REVISION_DATE: ${{ steps.decide.outputs.revision_date }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          target/release/showcase render --driver lavapipe --out "$RUNNER_TEMP/showcase" \
            --revision "$REVISION" --revision-date "$REVISION_DATE" --run-url "$RUN_URL"
          df -h "$GITHUB_WORKSPACE"
          du -sh "$RUNNER_TEMP/showcase"/* target

      - name: Showcase summary
        if: steps.render.outcome == 'success'
        run: |
          json="$RUNNER_TEMP/showcase/site/showcase.json"
          {
            echo "## Showcase video"
            echo
            jq -r '"Revision `\(.revision)` (\(.revision_date)); teaser \(.teaser[0]) px at quality \(.teaser[1])."' "$json"
            echo
            echo "| Take | Adapter | Mesa | Anisotropy override | Frames | Readiness (s) | Render (s) | Frame p50 (ms) | Frame p95 (ms) |"
            echo "|---|---|---|---|---|---|---|---|---|"
            jq -r '.takes[] | "| \(.name) | \(.adapter) | \(.mesa_release // "—") | \(.anisotropy_override // "none") | \(.frames) | \(.readiness_seconds | floor) | \(.render_seconds | floor) | \(.frame_wall_ms_p50 | floor) | \(.frame_wall_ms_p95 | floor) |"' "$json"
            echo
            echo "| Scene | First frame | Frames | Start tick |"
            echo "|---|---|---|---|"
            jq -r '.takes[].scenes[] | "| \(.name) | \(.first_frame) | \(.frames) | \(.start_tick) |"' "$json"
            echo
            echo "| File | Bytes | SHA-256 |"
            echo "|---|---|---|"
            jq -r '.files[] | "| \(.name) | \(.bytes) | `\(.sha256)` |"' "$json"
          } >> "$GITHUB_STEP_SUMMARY"

      # A 14-day debug copy: the site and the take manifests (per-frame ticks, checksums and hashes,
      # to compare two runs of one commit). The mezzanines stay behind: they are about 0.7 GB.
      - name: Upload the showcase as a workflow artifact
        if: steps.render.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: showcase-${{ steps.decide.outputs.revision }}
          retention-days: 14
          path: |
            ${{ runner.temp }}/showcase/site
            ${{ runner.temp }}/showcase/takes/*.manifest.ron
