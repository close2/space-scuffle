[workspace]
resolver = "2"
exclude = ["third_party/naga", "tools/renderer_compatibility"]
members = [
    "crates/sim_types",
    "crates/sim_map",
    "crates/sim_core",
    "crates/asset_baker",
    "crates/client",
    "crates/client_diagnostics",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.99.0"
authors = ["Space Scuffle Systems Engineering Team"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/space-scuffle/space-scuffle"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Pedagogical zero-shortcuts rules:
unwrap_used = "deny"
expect_used = "warn"
panic = "warn"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
# Style adjustments for domain terminology:
module_name_repetitions = "allow"
similar_names = "allow"
cast_possible_truncation = "warn"
cast_precision_loss = "warn"
cast_sign_loss = "warn"

[workspace.dependencies]
# Fixed-point deterministic math
# Exact pin: this crate defines authoritative arithmetic, so upgrades are checksum-schema events.
fixed = { version = "=1.31.0", features = ["serde"] }

# Serialization
serde = { version = "1.0.218", features = ["derive"] }
ron = "0.8.0"

# Error handling
thiserror = "2.0.12"

# Bit manipulation & flags
bitflags = { version = "2.8.0", features = ["serde"] }

# Fast deterministic hashing
xxhash-rust = { version = "0.8.15", features = ["xxh64", "xxh3"] }

# Deterministic PRNG
rand = { version = "0.8.5", default-features = false }
rand_chacha = { version = "0.3.1", default-features = false }

# Property-based testing (dev-dependency of the simulation crates)
proptest = { version = "1.5.0", default-features = false, features = ["std"] }

# Image processing (asset baking & flipbook textures)
image = { version = "0.25.5", default-features = false, features = ["png", "jpeg"] }

# Rendering Engine & UI (Visual Client crate only)
bevy = { version = "0.15.3", default-features = true }
bevy_egui = "0.33.0"

# Internal Workspace Crates
sim_types = { path = "crates/sim_types" }
sim_map = { path = "crates/sim_map" }
sim_core = { path = "crates/sim_core" }
asset_baker = { path = "crates/asset_baker" }
client = { path = "crates/client" }

# Reviewed Vulkan compiler corrections; provenance and regression commands live in third_party/README.md.
[patch.crates-io]
naga = { path = "third_party/naga" }

# Dependencies are optimised so asset decoding and fixed-point math do not dominate test time.
[profile.dev.package."*"]
opt-level = 2

# The simulation is optimised too, so whole matches fit the gate: the skirmish exit test
# (`crates/client/tests/skirmish_match_tests.rs`) and `full_match_tests.rs` play thousands of ticks.
# Overflow checks and debug assertions stay on, as in the rest of the dev profile.
[profile.dev.package.sim_core]
opt-level = 2

[profile.dev.package.sim_map]
opt-level = 2

[profile.test]
debug = "line-tables-only"
