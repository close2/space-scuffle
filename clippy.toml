# Clippy configuration for the whole workspace (charter §2, Phase 9 decision D-1).
#
# Clippy reads only the nearest clippy.toml, so the simulation crates' own files
# (crates/sim_types, crates/sim_map, crates/sim_core) repeat every setting here.
# Keep the threshold identical in all of them.

# No production function may exceed 100 counted lines; test code is exempt.
# See docs/plans/2026-11-03-phase-9-structure-and-docs.md, decision D-1.
too-many-lines-threshold = 100
