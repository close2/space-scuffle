[package]
name = "client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Bevy 3D renderer, custom WGSL shaders, and Visual Lab for Space Scuffle"

[[bin]]
name = "client"
path = "src/main.rs"

[[bin]]
name = "map_editor"
path = "src/bin/map_editor.rs"

[[bin]]
name = "terrain_preview"
path = "src/bin/terrain_preview.rs"

[lints]
workspace = true

[dependencies]
bevy.workspace = true
bevy_egui.workspace = true
sim_types.workspace = true
sim_map.workspace = true
sim_core.workspace = true
asset_baker.workspace = true
clap = { version = "4.5", features = ["derive"] }
ron.workspace = true
serde.workspace = true
image.workspace = true
bytemuck = { version = "1.25", features = ["derive"] }
thiserror.workspace = true

[dev-dependencies]
# The shipped catalogs and worlds, embedded for tests only; production loads them from disk.
sim_fixtures.workspace = true
naga = { version = "23.1.0", features = ["wgsl-in"] }
# Same composer and feature set as bevy_render, so tests resolve `#import` exactly as production does.
naga_oil = { version = "0.16.0", default-features = false, features = ["test_shader"] }
tempfile = "3.17"
