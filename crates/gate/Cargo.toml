[package]
name = "gate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Tiered test gates: selects and runs the tests a change can break, from crates/gate/suites.ron"
publish = false

[lints]
workspace = true

# The gate depends on no other workspace crate: it reads `cargo metadata`, Git and the sources as
# data, so a broken simulation or client crate can never break the tool that tests it
# (docs/plans/2026-11-04-tiered-test-gates.md §5.1). Every dependency is already in Cargo.lock.
[dependencies]
serde.workspace = true
serde_json = "1.0"
ron.workspace = true
thiserror.workspace = true
# Parses Cargo.lock and member manifests for the diff-aware selection (plan 2026-11-11 §4.4).
# Already locked through proc-macro-crate; `parse` only, so no package is added to the lockfile.
toml_edit = { version = "0.25.17", default-features = false, features = ["parse"] }

[dev-dependencies]
tempfile = "3.17"
