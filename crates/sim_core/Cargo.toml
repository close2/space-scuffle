[package]
name = "sim_core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Deterministic lockstep simulation core, combat, and steering for Space Scuffle"

[lints]
workspace = true

[dependencies]
sim_types.workspace = true
sim_map.workspace = true
thiserror.workspace = true
xxhash-rust = { workspace = true, features = ["xxh64"] }
rand.workspace = true
rand_chacha.workspace = true
serde.workspace = true
ron.workspace = true

[dev-dependencies]
# The shipped catalogs and worlds, embedded for tests only; production loads them from disk.
sim_fixtures.workspace = true
# Property tests of the effect-tree engine (plan 2026-11-10-spellcaster-mechanics §11).
proptest.workspace = true

# Release throughput report; run with `cargo bench -p sim_core --bench throughput`.
[[bench]]
name = "throughput"
harness = false
